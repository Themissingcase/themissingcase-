<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes" />
    <title>The Missing Clue — Interactive Detective Mystery</title>
    <meta name="description" content="Every crime leaves a clue. Can you find it? A hand-painted Victorian detective mystery game combining hidden-object crime scenes, red-string deduction boards, and suspect interrogations." />
    <meta property="og:title" content="The Missing Clue — Interactive Detective Mystery" />
    <meta property="og:description" content="Every crime leaves a clue. Can you find it? A hand-painted Victorian detective mystery game combining hidden-object crime scenes, red-string deduction boards, and suspect interrogations." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Progressive Web App (PWA) Android & iOS Meta Configuration -->
    <meta name="theme-color" content="#0D0C0B" />
    <meta name="background-color" content="#0D0C0B" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Missing Clue" />
    <meta name="application-name" content="The Missing Clue" />

    <!-- PWA Icons & Apple Touch Icon (vite-plugin-pwa injects manifest.webmanifest) -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/pwa-192x192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/pwa-512x512.png" />
    <link rel="shortcut icon" href="/favicon.ico" />

    <!-- Typography Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=JetBrains+Mono:wght@400;500&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body class="bg-[#0D0C0B] text-[#F4EFE6] antialiased selection:bg-[#C5A059]/30 selection:text-[#F4EFE6]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js', { scope: '/' })
            .then((registration) => {
              console.log('[PWA] Service Worker active with scope:', registration.scope);
            })
            .catch((error) => {
              console.warn('[PWA] Service Worker registration failed:', error);
            });
        });
      }
    </script>
  </body>
</html>
